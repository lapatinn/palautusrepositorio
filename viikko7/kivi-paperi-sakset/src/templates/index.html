<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kivi-paperi-sakset</title>
  </head>
  <body>
    <h1>Kivi-paperi-sakset</h1>
    <form method="post" action="/start">
      <p>Valitse pelitapa:</p>
      <label><input type="radio" name="tyyppi" value="a"> (a) Ihmistä vastaan</label><br>
      <label><input type="radio" name="tyyppi" value="b" checked> (b) Tekoälyä vastaan</label><br>
      <label><input type="radio" name="tyyppi" value="c"> (c) Parannettua tekoälyä vastaan</label><br>
      <p><button type="submit">Aloita peli</button></p>
    </form>
    <p>Siirtoina käytä: k = kivi, p = paperi, s = sakset</p>
  </body>
</html>
